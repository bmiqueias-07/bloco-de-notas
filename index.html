<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteFácil - Bloco de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📝 NoteFácil</h1>
        <p>Suas ideias organizadas em um só lugar!</p>
    </header>

    <main>
        <input type="text" id="titulo" placeholder="Título da anotação">

        <textarea id="texto" placeholder="Escreva sua anotação aqui..."></textarea>

        <button id="salvar">Salvar anotação</button>

        <h2>Minhas anotações</h2>
        <div id="listaNotas"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
